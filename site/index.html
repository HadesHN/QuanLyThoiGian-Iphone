<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#142e35">
  <meta name="description" content="Lên mục tiêu, lập kế hoạch và quản lý thời gian theo phương pháp trong Sổ tay GOTINO.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thời Gian">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=1.3.1">
  <title>Thời Gian Của Tôi · Sổ tay hành động</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✳</span><span><strong>THỜI GIAN</strong><small>Sổ tay hành động</small></span></div>
      <div class="side-label">ĐIỀU HƯỚNG</div>
      <nav class="nav-list" aria-label="Điều hướng chính" id="nav">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">◫</span> Tổng quan</button>
        <button class="nav-link" data-page="today"><span class="nav-icon">◷</span> Việc cần làm</button>
        <button class="nav-link" data-page="calendar"><span class="nav-icon">▦</span> Lịch làm việc</button>
        <button class="nav-link" data-page="goals"><span class="nav-icon">◎</span> Mục tiêu</button>
        <details class="nav-group" id="group-personal">
          <summary><span class="nav-icon">✧</span> Phát triển bản thân <span class="nav-chevron">⌄</span></summary>
          <div class="nav-subitems">
            <button class="nav-link" data-page="habits"><span class="nav-icon">✓</span> Thói quen</button>
            <button class="nav-link" data-page="vision"><span class="nav-icon">✦</span> Định hướng</button>
          </div>
        </details>
        <details class="nav-group" id="group-tools">
          <summary><span class="nav-icon">▤</span> Sổ tay & tài chính <span class="nav-chevron">⌄</span></summary>
          <div class="nav-subitems">
            <button class="nav-link" data-page="contacts"><span class="nav-icon">♧</span> Làm chủ mối quan hệ</button>
            <button class="nav-link" data-page="finance"><span class="nav-icon">₫</span> Quản trị tài chính</button>
            <button class="nav-link" data-page="notes"><span class="nav-icon">✎</span> Ghi chú sáng tạo</button>
          </div>
        </details>
        <details class="nav-group" id="group-reports">
          <summary><span class="nav-icon">▥</span> Báo cáo & đánh giá <span class="nav-chevron">⌄</span></summary>
          <div class="nav-subitems">
            <button class="nav-link" data-page="journal"><span class="nav-icon">☷</span> Tổng kết ngày</button>
            <button class="nav-link" data-page="statistics"><span class="nav-icon">▥</span> Thống kê</button>
          </div>
        </details>
      </nav>
      <div class="side-bottom">
        <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span> Cài đặt & dữ liệu</button>
        <div class="designer-credit">Designed by Hoàng ĐC</div>
        <div class="version">Phiên bản 1.3.1 · Lưu trên thiết bị</div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-btn" class="icon-button mobile-only" aria-label="Mở menu">☰</button>
          <span class="breadcrumb">SỔ TAY CÁ NHÂN <span> / </span> <strong id="breadcrumb">Tổng quan</strong></span>
        </div>
        <div class="topbar-actions">
          <span id="live-date" class="top-date"></span>
          <span class="online-indicator" title="Dữ liệu được lưu cục bộ trên thiết bị"><i></i> Đã bật lưu cục bộ</span>
          <button class="primary-btn compact" data-action="new-task">＋ <span>Thêm công việc</span></button>
        </div>
      </header>
      <main id="app" tabindex="-1" aria-live="polite"></main>
      <footer class="footer">Thời gian của tôi · Dữ liệu lưu cục bộ, hãy sao lưu định kỳ.</footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <script src="./app.js?v=1.3.1" defer></script>
</body>
</html>
