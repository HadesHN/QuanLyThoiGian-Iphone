name: Website iPhone - GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-web
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Kiểm tra cú pháp JavaScript
        run: |
          node --check site/app.js
          node --check site/events.js
          node --check site/sw.js
      - name: Kiểm tra lưu dữ liệu
        run: node tests/web-storage.test.cjs
      - name: Kiểm tra tài nguyên Web và iPhone
        run: node tests/web-assets.test.cjs
      - name: Kiểm tra sự kiện và mốc nhắc
        run: node tests/events.test.cjs
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v5
