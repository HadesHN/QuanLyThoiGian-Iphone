name: Build APK - Thoi Gian Cua Toi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Kiem tra Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Khong tim thay Android SDK tai $sdk_root."
            exit 1
          fi

          if [[ ! -s "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              manager="$(command -v sdkmanager || true)"
            fi
            if [[ ! -x "$manager" ]]; then
              echo "::error::Khong tim thay sdkmanager de cai SDK API 35."
              exit 1
            fi
            if ! (set +o pipefail; yes | "$manager" --sdk_root="$sdk_root" --licenses); then
              echo "::error::Khong the chap nhan giay phep Android SDK."
              exit 1
            fi
            "$manager" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0"
          fi

          if [[ ! -s "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            echo "::error::SDK API 35 hoac Build Tools 35.0.0 chua san sang."
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          echo "Android SDK API 35 and Build Tools 35.0.0: OK"

      - name: Cau hinh Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Dong bo giao dien Web vao Android
        run: |
          python3 tools/sync_web_to_android.py
          python3 tools/sync_web_to_android.py --check

      - name: Kiem tra nguon va tinh nang
        run: |
          node --check site/app.js
          node --check app/src/main/assets/app.js
          node tests/web-storage.test.cjs
          node tests/web-assets.test.cjs
          node tests/events.test.cjs
          node tests/android-assets-sync.test.cjs
          gradle --version

      - name: Build APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Xac nhan va dat ten APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ThoiGianCuaToi-debug.apk
          ls -lh dist/ThoiGianCuaToi-debug.apk

      - name: Dang tai APK cho nguoi dung
        uses: actions/upload-artifact@v4
        with:
          name: ThoiGianCuaToi-APK
          path: dist/ThoiGianCuaToi-debug.apk
          if-no-files-found: error
          retention-days: 30
